name: Build Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'

permissions:
  contents: read

jobs:
  build-sources:
    name: "📝 Sources"
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      source-date-epoch: ${{ steps.epoch.outputs.epoch }}
    steps:
    - uses: actions/checkout@v7

    # Timestamps in the binaries and archives are pinned to the commit date, for reproducible builds.
    - name: Get Commit Date
      id: epoch
      run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

    - name: Install Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y wget zip

    - name: Download Sources
      run: ./download-sources.sh

    - name: Create Archive
      run: zip -r deps-sources.zip deps-build

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-sources.zip
        archive: false
        if-no-files-found: error
        retention-days: 7

  build-windows-source:
    name: "💻 Windows (Qt Source)"
    needs: build-sources
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-sources.outputs.source-date-epoch }}
    steps:
    - uses: actions/checkout@v7

    - name: Download Sources
      uses: actions/download-artifact@v8
      with:
        name: deps-sources.zip
        skip-decompress: true

    - name: Extract Sources
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" x deps-sources.zip

    - name: Build x64 Dependencies
      run: .\build-dependencies-windows.bat x64 -skip-download -skip-cleanup

    - name: Build ARM64 Dependencies
      run: .\build-dependencies-windows.bat arm64 -skip-download -skip-cleanup

    # 7-Zip stores the modification time of each file, and has no option to override it.
    - name: Normalize Timestamps
      shell: pwsh
      run: |
        $date = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SOURCE_DATE_EPOCH).UtcDateTime
        Get-Item windows-x64, windows-arm64 | ForEach-Object { $_.LastWriteTimeUtc = $date }
        Get-ChildItem windows-x64, windows-arm64 -Recurse -Force | ForEach-Object { $_.LastWriteTimeUtc = $date }

    - name: Create Archives
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r deps-windows-x64.7z windows-x64
        "C:\Program Files\7-Zip\7z.exe" a -r deps-windows-arm64.7z windows-arm64

    - name: Upload x64 Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-windows-x64.7z
        archive: false
        if-no-files-found: error
        retention-days: 7

    - name: Upload ARM64 Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-windows-arm64.7z
        archive: false
        if-no-files-found: error
        retention-days: 7

  build-windows-installer:
    name: "💻 Windows (Qt Installer)"
    needs: build-sources
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-sources.outputs.source-date-epoch }}
    steps:
    - uses: actions/checkout@v7

    - name: Download Sources
      uses: actions/download-artifact@v8
      with:
        name: deps-sources.zip
        skip-decompress: true

    - name: Extract Sources
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" x deps-sources.zip

    - name: Build x64 Dependencies
      env:
        QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
        QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
      run: .\build-dependencies-windows.bat x64 -skip-download -skip-cleanup -qt-binaries

    - name: Build ARM64 Dependencies
      env:
        QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
        QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
      run: .\build-dependencies-windows.bat arm64 -skip-download -skip-cleanup -qt-binaries

    # 7-Zip stores the modification time of each file, and has no option to override it.
    - name: Normalize Timestamps
      shell: pwsh
      run: |
        $date = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SOURCE_DATE_EPOCH).UtcDateTime
        Get-Item windows-x64, windows-arm64 | ForEach-Object { $_.LastWriteTimeUtc = $date }
        Get-ChildItem windows-x64, windows-arm64 -Recurse -Force | ForEach-Object { $_.LastWriteTimeUtc = $date }

    - name: Create Archives
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r deps-windows-qt-installer-x64.7z windows-x64
        "C:\Program Files\7-Zip\7z.exe" a -r deps-windows-qt-installer-arm64.7z windows-arm64

    - name: Upload x64 Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-windows-qt-installer-x64.7z
        archive: false
        if-no-files-found: error
        retention-days: 7

    - name: Upload ARM64 Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-windows-qt-installer-arm64.7z
        archive: false
        if-no-files-found: error
        retention-days: 7

  build-macos:
    name: "🍎 MacOS"
    needs: build-sources
    runs-on: macos-26
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-sources.outputs.source-date-epoch }}
    steps:
    - uses: actions/checkout@v7

    - name: Download Sources
      uses: actions/download-artifact@v8
      with:
        name: deps-sources.zip
        skip-decompress: true

    - name: Extract Sources
      run: unzip deps-sources.zip

    - name: Use Xcode 26.5
      run: sudo xcode-select -s /Applications/Xcode_26.5.app

    - name: Build Dependencies
      run: ./build-dependencies-mac.sh -skip-download macos-universal

    # GNU tar is used, as the system tar is not able to sort or override timestamps.
    - name: Create Archive
      run: gtar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cJf deps-macos-universal.tar.xz macos-universal

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-macos-universal.tar.xz
        archive: false
        if-no-files-found: error
        retention-days: 7

  build-linux:
    name: "🐧 Linux ${{ matrix.arch }}"
    needs: build-sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-sources.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v7

    - name: Download Sources
      uses: actions/download-artifact@v8
      with:
        name: deps-sources.zip
        skip-decompress: true

    - name: Extract Sources
      run: unzip deps-sources.zip

    - name: Install Packages
      run: ./install-packages-linux.sh

    - name: Build Dependencies
      run: ./build-dependencies-linux.sh -skip-download "linux-${{ matrix.arch }}"

    - name: Build FFmpeg
      run: ./build-ffmpeg-linux.sh "linux-${{ matrix.arch }}"

    - name: Create Archive
      run: tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cJf "deps-linux-${{ matrix.arch }}.tar.xz" "linux-${{ matrix.arch }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-linux-${{ matrix.arch }}.tar.xz
        archive: false
        if-no-files-found: error
        retention-days: 7

  build-linux-cross:
    name: "🐧 Linux ${{ matrix.arch }}"
    needs: [build-sources, build-linux]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/duckstation/cross-build-${{ matrix.arch }}:latest
    timeout-minutes: 240
    env:
      SOURCE_DATE_EPOCH: ${{ needs.build-sources.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["arm64", "armhf"]
    steps:
    - uses: actions/checkout@v7

    - name: Download Sources
      uses: actions/download-artifact@v8
      with:
        name: deps-sources.zip
        skip-decompress: true

    - name: Extract Sources
      run: unzip deps-sources.zip

    - name: Download x64 Artifact
      uses: actions/download-artifact@v8
      with:
        name: deps-linux-x64.tar.xz
        skip-decompress: true

    - name: Extract x64 Artifact
      run: tar -xvf deps-linux-x64.tar.xz

    - name: Build Dependencies
      run: |
        ./build-dependencies-linux-cross.sh -skip-download "linux-x64" "${{ matrix.arch }}" "/${{ matrix.arch }}-chroot" "linux-cross-${{ matrix.arch }}"

    - name: Create Archive
      run: tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cJf "deps-linux-cross-${{ matrix.arch }}.tar.xz" "linux-cross-${{ matrix.arch }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: deps-linux-cross-${{ matrix.arch }}.tar.xz
        archive: false
        if-no-files-found: error
        retention-days: 7

  create-release:
    name: "📤 Create Release"
    if: github.ref == 'refs/heads/master'
    needs: [build-windows-source, build-windows-installer, build-macos, build-linux, build-linux-cross, build-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - name: Get Current Date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
        skip-decompress: true

    - name: Create Release
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        TAG: release-${{ steps.date.outputs.date }}
      run: |
        gh release delete "$TAG" --yes --cleanup-tag || true
        gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes "Dependencies built on $(date +'%Y-%m-%d') from commit $GITHUB_SHA." \
          artifacts/deps-windows-x64.7z \
          artifacts/deps-windows-arm64.7z \
          artifacts/deps-windows-qt-installer-x64.7z \
          artifacts/deps-windows-qt-installer-arm64.7z \
          artifacts/deps-macos-universal.tar.xz \
          artifacts/deps-linux-x64.tar.xz \
          artifacts/deps-linux-arm64.tar.xz \
          artifacts/deps-linux-cross-arm64.tar.xz \
          artifacts/deps-linux-cross-armhf.tar.xz \
          artifacts/deps-sources.zip
